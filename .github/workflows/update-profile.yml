name: Refresh profile project status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types:
      - project-status-changed
  push:
    branches:
      - main
    paths:
      - profile-status.json
      - .github/scripts/update_profile.py
      - .github/workflows/update-profile.yml
  pull_request:
    paths:
      - README.md
      - profile-status.json
      - .github/scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-project-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh approved project status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
        run: python .github/scripts/update_profile.py

      - name: Validate generated blocks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          status = json.loads(Path("profile-status.json").read_text(encoding="utf-8"))

          marker_pairs = (
              ("<!-- PROJECT_STATUS:START -->", "<!-- PROJECT_STATUS:END -->"),
              ("<!-- CRITIQUAL_FEATURE:START -->", "<!-- CRITIQUAL_FEATURE:END -->"),
          )
          for start, end in marker_pairs:
              if readme.count(start) != 1 or readme.count(end) != 1:
                  raise SystemExit(f"README markers must each appear exactly once: {start} / {end}")
              if readme.index(start) >= readme.index(end):
                  raise SystemExit(f"README markers are out of order: {start} / {end}")

          sources = status.get("sources", {})
          if "private_critiqual_tracker" in sources:
              raise SystemExit("profile automation must not read CritiQual state from the Padayon tracker")
          pio_source = sources.get("private_critiqual_pio")
          if not isinstance(pio_source, dict):
              raise SystemExit("profile-status.json is missing the CritiQual PIO source")
          if pio_source.get("repository") != "Baelfyre/CritiQual":
              raise SystemExit("CritiQual PIO source repository drift")
          if pio_source.get("path") != "profile-pio.json":
              raise SystemExit("CritiQual PIO source path drift")
          if pio_source.get("authority") != "public_presentation_only":
              raise SystemExit("CritiQual PIO source must remain presentation-only")

          projects = status.get("projects", [])
          critiqual = [item for item in projects if item.get("id") == "critiqual"]
          if len(critiqual) != 1:
              raise SystemExit("profile-status.json must contain exactly one CritiQual project entry")
          critiqual = critiqual[0]

          if not isinstance(critiqual.get("featured"), bool):
              raise SystemExit("CritiQual featured fallback must be boolean")
          if not isinstance(critiqual.get("summary"), str) or not critiqual["summary"].strip():
              raise SystemExit("CritiQual summary fallback must be non-empty")
          for field in ("current_state", "next_direction"):
              if not isinstance(critiqual.get(field), str) or not critiqual[field].strip():
                  raise SystemExit(f"CritiQual {field} fallback must be non-empty")

          if "| CritiQual |" not in readme:
              raise SystemExit("generated project-status table is missing CritiQual")
          if critiqual["current_state"] not in readme:
              raise SystemExit("generated README is missing the CritiQual PIO/fallback status")
          if critiqual["next_direction"] not in readme:
              raise SystemExit("generated README is missing the CritiQual PIO/fallback next direction")

          if critiqual["featured"] and "<strong>CritiQual</strong>" not in readme:
              raise SystemExit("README featured-project block is missing CritiQual")

          print("Generated README project blocks and CritiQual PIO source are valid.")
          PY

      - name: Show generated diff on pull requests
        if: github.event_name == 'pull_request'
        run: git diff -- README.md profile-status.json

      - name: Commit only meaningful status changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- README.md profile-status.json; then
            echo "No public profile status changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-status.json
          git commit -m "docs: refresh profile project status"
          git push
