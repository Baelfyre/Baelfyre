name: Refresh profile project status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types:
      - project-status-changed

permissions:
  contents: write

concurrency:
  group: profile-project-status
  cancel-in-progress: false

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh approved project status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
        run: python .github/scripts/update_profile.py

      - name: Validate generated block
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          start = "<!-- PROJECT_STATUS:START -->"
          end = "<!-- PROJECT_STATUS:END -->"

          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit("README project-status markers must each appear exactly once.")

          if readme.index(start) >= readme.index(end):
              raise SystemExit("README project-status markers are out of order.")

          print("Generated README block markers are valid.")
          PY

      - name: Commit only meaningful status changes
        shell: bash
        run: |
          if git diff --quiet -- README.md profile-status.json; then
            echo "No public profile status changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-status.json
          git commit -m "docs: refresh profile project status"
          git push
